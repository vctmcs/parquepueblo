<section class="contenedor admin-entrar">
    <form class="tarjeta-form" method="post" action="{{base}}/admin/entrar">
        <span class="etiqueta">Administración</span>
        <h1>Entrar</h1>
        {{{aviso}}}
        {{{error}}}
        <input type="hidden" name="csrf" value="{{csrf}}">
        <div class="campo">
            <label for="usuario">Usuario</label>
            <input id="usuario" name="usuario" type="text" autocomplete="username" required>
        </div>
        <div class="campo">
            <label for="clave">Contraseña</label>
            <input id="clave" name="clave" type="password" autocomplete="current-password" required>
        </div>
        <button class="boton" type="submit">Entrar</button>
    </form>
</section>
