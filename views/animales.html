<section class="contenedor encabezado">
    <span class="etiqueta">Catálogo</span>
    <h1>Los animales del parque</h1>
    <p>Busca por nombre o filtra por grupo. Cada ficha indica en qué recinto del mapa se encuentra y, si tiene, su modelo en 3D.</p>
</section>

<section class="contenedor catalogo">
    <div class="filtros" role="search">
        <label class="buscador">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="buscar" type="search" placeholder="Buscar: león, Panthera, jirafa..." autocomplete="off" aria-label="Buscar animal">
        </label>
        <div class="chips" id="chips" aria-label="Filtrar por grupo"></div>
    </div>

    <p class="catalogo__conteo" id="conteo" aria-live="polite"></p>
    <div class="rejilla" id="rejilla">
        <span class="cargando" aria-label="Cargando"></span>
    </div>
</section>

<dialog class="ficha-modal" id="ficha">
    <div class="ficha-modal__cuerpo" id="ficha-cuerpo"></div>
    <form method="dialog"><button class="ficha-modal__cerrar" aria-label="Cerrar">&times;</button></form>
</dialog>
