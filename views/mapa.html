<section class="mapa-pagina">
    <div class="mapa-layout">

        <!-- ===== Lienzo del mapa ===== -->
        <div class="mapa-zona">
            <div class="mapa-lienzo" id="lienzo">
                <svg id="mapa" viewBox="0 0 600 1360" role="img" aria-labelledby="mapa-titulo" preserveAspectRatio="xMidYMid meet">
                    <title id="mapa-titulo">Mapa del Parque del Pueblo con recintos y servicios</title>
                    <defs>
                        <pattern id="p-pasto" width="18" height="18" patternUnits="userSpaceOnUse">
                            <rect width="18" height="18" fill="#86b35f"/>
                            <circle cx="4" cy="5" r="1.1" fill="#79a654"/>
                            <circle cx="13" cy="12" r="1.1" fill="#93bf6b"/>
                            <circle cx="9" cy="16" r=".9" fill="#79a654"/>
                        </pattern>
                        <pattern id="p-arena" width="12" height="12" patternUnits="userSpaceOnUse">
                            <rect width="12" height="12" fill="#ecdfc2"/>
                            <circle cx="3" cy="3" r=".8" fill="#dfcfab"/>
                            <circle cx="9" cy="8" r=".7" fill="#e5d6b4"/>
                        </pattern>
                        <pattern id="p-agua" width="40" height="20" patternUnits="userSpaceOnUse">
                            <rect width="40" height="20" fill="#68acd6"/>
                            <path d="M0 10 Q 10 6 20 10 T 40 10" fill="none" stroke="#8cc5e6" stroke-width="1.4"/>
                        </pattern>
                        <pattern id="p-textura" width="10" height="10" patternUnits="userSpaceOnUse">
                            <circle cx="2" cy="2" r=".9" fill="#000" opacity=".06"/>
                            <circle cx="7" cy="7" r=".9" fill="#fff" opacity=".12"/>
                        </pattern>
                        <filter id="f-sombra" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1c211d" flood-opacity=".28"/>
                        </filter>

                        <!-- Iconos de servicios (24x24) -->
                        <symbol id="ico-banos" viewBox="0 0 24 24"><circle cx="7" cy="4" r="2"/><circle cx="17" cy="4" r="2"/><path d="M5 8h4l1 7H8v6H6v-6H4zM15 8h4l2 7h-2v6h-4v-6h-2z"/></symbol>
                        <symbol id="ico-embarcadero" viewBox="0 0 24 24"><path d="M2 14h20l-3 5H5z"/><path d="M11 3h2v10h-2z"/><path d="M13 4l6 7h-6z"/></symbol>
                        <symbol id="ico-acuario" viewBox="0 0 24 24"><path d="M3 12c3-5 9-6 13-2l4-3v10l-4-3c-4 4-10 3-13-2z"/><circle cx="7" cy="11" r="1" fill="#fff"/></symbol>
                        <symbol id="ico-museo" viewBox="0 0 24 24"><path d="M12 2 2 7v2h20V7z"/><path d="M4 10h3v8H4zM10.5 10h3v8h-3zM17 10h3v8h-3zM2 19h20v3H2z"/></symbol>
                        <symbol id="ico-aviario" viewBox="0 0 24 24"><path d="M3 14c4 0 6-4 9-4 2 0 3 1 4 1l5-2-3 4c0 4-4 7-9 7H4l3-3z"/><circle cx="16" cy="10" r="1" fill="#fff"/></symbol>
                        <symbol id="ico-isla" viewBox="0 0 24 24"><path d="M12 9c-2-3-6-4-9-2 3 0 5 1 7 3-3 0-5 2-6 4 3-2 5-2 7-2l-1 8h3l-1-8c2 0 4 0 6 2-1-2-3-4-6-4 2-2 4-3 7-3-3-2-7-1-7 2z"/><path d="M3 21h18v2H3z"/></symbol>
                        <symbol id="ico-nocturnario" viewBox="0 0 24 24"><path d="M15 3a9 9 0 1 0 6 15A8 8 0 0 1 15 3z"/><path d="M19 4l.8 1.6 1.7.3-1.3 1.1.4 1.7L19 7.8l-1.6.9.4-1.7-1.3-1.1 1.7-.3z"/></symbol>
                        <symbol id="ico-teatro" viewBox="0 0 24 24"><path d="M2 4h10v6a5 5 0 0 1-10 0z"/><path d="M12 9h10v6a5 5 0 0 1-10 0z"/><circle cx="5" cy="8" r="1" fill="#fff"/><circle cx="9" cy="8" r="1" fill="#fff"/><circle cx="15" cy="13" r="1" fill="#fff"/><circle cx="19" cy="13" r="1" fill="#fff"/></symbol>
                        <symbol id="ico-serpientes" viewBox="0 0 24 24"><path d="M4 18c0-3 3-4 6-4s5-1 5-3-2-3-4-3H8V5h3c4 0 7 2 7 6s-3 6-7 6c-2 0-3 1-3 2s1 1 3 1h9v2h-9c-4 0-7-1-7-3z"/><circle cx="8" cy="6.5" r="2"/></symbol>
                        <symbol id="ico-codornices" viewBox="0 0 24 24"><ellipse cx="12" cy="14" rx="8" ry="6"/><circle cx="17" cy="8" r="3.5"/><path d="M20 8l3 1-3 1z"/><path d="M16 3c1 0 2 1 2 2l-1 .5z"/></symbol>
                        <symbol id="ico-kiosko" viewBox="0 0 24 24"><path d="M12 2 2 9h20z"/><path d="M4 10h2v9H4zM18 10h2v9h-2zM11 10h2v9h-2zM2 19h20v3H2z"/></symbol>
                        <symbol id="ico-granja" viewBox="0 0 24 24"><path d="M12 2 2 8v14h20V8z"/><path d="M8 13h8v9H8z" fill="#fff"/><path d="M8 13l8 9M16 13l-8 9" stroke="#b42f24" stroke-width="1.3"/></symbol>
                        <symbol id="ico-juegos" viewBox="0 0 24 24"><path d="M3 22 9 4h2L5 22zM21 22 15 4h-2l6 18z"/><path d="M8 7h8v2H8z"/><path d="M11.5 9h1v6h-1z"/><rect x="9.5" y="15" width="5" height="2"/></symbol>
                        <symbol id="ico-entrada" viewBox="0 0 24 24"><path d="M2 10 12 3l10 7v2H2z"/><path d="M4 12h3v10H4zM17 12h3v10h-3zM9 14h6v8H9z"/></symbol>
                    </defs>

                    <g id="vista">
                        <!-- Terreno -->
                        <rect x="0" y="0" width="600" height="1360" rx="26" fill="url(#p-pasto)"/>
                        <rect x="3" y="3" width="594" height="1354" rx="24" fill="none" stroke="#4e7d3a" stroke-width="5"/>

                        <!-- Andadores -->
                        <g class="andadores" fill="url(#p-arena)" stroke="#d3c196" stroke-width="1.5">
                            <rect x="8" y="14" width="272" height="444" rx="16"/>
                            <rect x="8" y="420" width="104" height="326" rx="16"/>
                            <rect x="404" y="14" width="190" height="974" rx="16"/>
                            <rect x="108" y="440" width="18" height="820" rx="9"/>
                            <rect x="390" y="440" width="20" height="890" rx="9"/>
                            <rect x="110" y="886" width="296" height="18" rx="9"/>
                            <path d="M332 1110 C 360 1180, 360 1250, 398 1300" fill="none" stroke="#ecdfc2" stroke-width="18" stroke-linecap="round"/>
                            <rect x="118" y="1032" width="40" height="16"/>
                            <rect x="404" y="1000" width="190" height="16" rx="8"/>
                        </g>

                        <!-- Explanada del kiosko -->
                        <g class="explanada">
                            <circle cx="240" cy="1040" r="122" fill="url(#p-arena)" stroke="#d3c196" stroke-width="1.5"/>
                            <circle cx="240" cy="1040" r="100" fill="url(#p-pasto)"/>
                            <g fill="url(#p-arena)">
                                <rect x="231" y="940" width="18" height="200"/>
                                <rect x="140" y="1031" width="200" height="18"/>
                                <rect x="231" y="940" width="18" height="200" transform="rotate(45 240 1040)"/>
                                <rect x="231" y="940" width="18" height="200" transform="rotate(-45 240 1040)"/>
                            </g>
                            <circle cx="240" cy="1040" r="62" fill="none" stroke="#ecdfc2" stroke-width="14"/>
                            <circle cx="240" cy="1040" r="34" fill="url(#p-arena)" stroke="#d3c196"/>
                        </g>

                        <!-- Río y lago -->
                        <path class="agua" fill="url(#p-agua)" stroke="#4d93c0" stroke-width="2.5" d="
                            M 290 0 L 350 0
                            C 345 80, 360 150, 350 230
                            C 340 320, 372 380, 378 460
                            C 386 560, 384 680, 372 780
                            C 362 850, 300 878, 240 866
                            C 190 856, 168 812, 152 770
                            C 132 710, 128 640, 138 590
                            C 150 520, 190 482, 240 474
                            C 280 466, 298 420, 296 340
                            C 292 250, 284 150, 290 0 Z"/>

                        <!-- Isla -->
                        <path fill="#6f9f4c" stroke="#e8d9b5" stroke-width="5" d="M196 548 C 236 520, 280 556, 272 612 C 266 652, 250 694, 222 690 C 192 684, 178 632, 182 590 C 184 566, 188 556, 196 548 Z"/>

                        <!-- Flamencos y cisnes decorativos -->
                        <g fill="#fff" opacity=".9">
                            <ellipse cx="300" cy="760" rx="9" ry="5"/><circle cx="306" cy="752" r="3"/>
                            <ellipse cx="322" cy="770" rx="9" ry="5"/><circle cx="328" cy="762" r="3"/>
                        </g>
                        <g fill="#f08aa0">
                            <ellipse cx="250" cy="810" rx="6" ry="4"/><path d="M252 806 q4 -10 0 -14" stroke="#f08aa0" stroke-width="2" fill="none"/>
                            <ellipse cx="268" cy="818" rx="6" ry="4"/><path d="M270 814 q4 -10 0 -14" stroke="#f08aa0" stroke-width="2" fill="none"/>
                        </g>

                        <!-- Árboles (los coloca mapa.js) -->
                        <g id="capa-arboles"></g>

                        <!-- Puerta de entrada -->
                        <g transform="translate(400 1330)">
                            <rect x="-40" y="-14" width="80" height="22" rx="4" fill="#f3ead8" stroke="#8a5a35" stroke-width="2"/>
                            <path d="M-46 -14 L0 -36 L46 -14 Z" fill="#b8432f"/>
                        </g>

                        <!-- Rosa de los vientos -->
                        <g transform="translate(560 1300)" class="rosa">
                            <circle r="22" fill="#fffdf8" stroke="#1f3d2b" stroke-width="1.5"/>
                            <path d="M0 -17 L5 0 L0 4 L-5 0 Z" fill="#b8432f"/>
                            <path d="M0 17 L5 0 L0 -4 L-5 0 Z" fill="#1f3d2b"/>
                            <text y="-26" text-anchor="middle" font-size="11" font-weight="700" fill="#1f3d2b">N</text>
                        </g>

                        <text x="232" y="560" class="rotulo-isla">ISLA</text>
                        <text x="350" y="120" class="rotulo-agua" transform="rotate(84 350 120)">RÍO</text>
                        <text x="240" y="790" class="rotulo-agua">LAGO</text>

                        <g id="capa-recintos"></g>
                        <g id="capa-servicios"></g>
                    </g>
                </svg>
            </div>

            <div class="mapa-controles" role="group" aria-label="Zoom del mapa">
                <button type="button" data-zoom="in" aria-label="Acercar">+</button>
                <button type="button" data-zoom="out" aria-label="Alejar">&minus;</button>
                <button type="button" data-zoom="reset" aria-label="Ver todo el mapa">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
                </button>
            </div>
            <p class="mapa-ayuda">Arrastra para moverte · rueda o pellizco para acercar · toca un recinto</p>
        </div>

        <!-- ===== Panel lateral ===== -->
        <aside class="mapa-panel" aria-label="Recintos y servicios">
            <div class="mapa-panel__cabeza">
                <h1>Mapa del parque</h1>
                <label class="buscador">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <input id="buscar-mapa" type="search" placeholder="Buscar animal o servicio" autocomplete="off" aria-label="Buscar en el mapa">
                </label>
                <div class="chips" id="chips-mapa"></div>
            </div>

            <div class="mapa-panel__listas" id="listas">
                <h2 class="lista-titulo">Recintos</h2>
                <ol class="lista" id="lista-recintos"></ol>
                <h2 class="lista-titulo">Servicios</h2>
                <ul class="lista" id="lista-servicios"></ul>
            </div>
        </aside>
    </div>

    <!-- Detalle del elemento seleccionado -->
    <section class="detalle" id="detalle" aria-live="polite" hidden>
        <button class="detalle__cerrar" type="button" id="cerrar-detalle" aria-label="Cerrar detalle">&times;</button>
        <div class="detalle__cuerpo" id="detalle-cuerpo"></div>
    </section>
</section>
