<section class="contenedor admin">
    <div class="admin__cabeza">
        <div>
            <span class="etiqueta">Administración</span>
            <h1>Donativos</h1>
        </div>
        <div class="admin__acciones">
            <a class="boton boton--claro" href="{{base}}/admin/exportar">Descargar CSV</a>
            <form method="post" action="{{base}}/admin/salir">
                <input type="hidden" name="csrf" value="{{csrf}}">
                <button class="boton" type="submit">Salir</button>
            </form>
        </div>
    </div>

    <div class="admin__resumen" id="resumen"></div>

    <div class="admin__filtros">
        <label class="buscador">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="buscar" type="search" placeholder="Buscar por nombre, correo o folio" aria-label="Buscar donativos">
        </label>
    </div>

    <div class="tabla-envoltura">
        <table class="tabla">
            <thead>
                <tr>
                    <th>Folio</th><th>Fecha</th><th>Nombre</th><th>Correo</th><th>Campaña</th><th>Animal</th><th class="num">Monto</th><th>Mensaje</th>
                </tr>
            </thead>
            <tbody id="filas"></tbody>
        </table>
    </div>
</section>
